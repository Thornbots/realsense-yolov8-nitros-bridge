# realsense_640x480x60.yaml
#
# Color 60 fps, depth 30 fps — depth halved to avoid USB 3.x bandwidth
# issues (UVC watchdog / "Depth stream start failure") on constrained
# controllers. Revert depth_module profile to '640x480x60' if yours has
# no issues at 60+60.
# see README.md for the frame-rate-split rationale

rgb_camera:
  profile: '640x480x60'
color_qos: "DEFAULT"

depth_module:
  profile: '640x480x60'
  emitter_enabled: 1       # Keep IR emitter ON for structured-light depth accuracy.
  emitter_on_off: false    # Constant emission (not alternating with IR off frames).
depth_qos: "DEFAULT"
depth_info_qos: "DEFAULT"

enable_accel: false
enable_color: true
enable_depth: true
enable_gyro: false
enable_infra1: false
enable_infra2: false

align_depth.enable: false
publish_tf: true
initial_reset: true

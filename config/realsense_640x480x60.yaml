# realsense_640x480x60.yaml
#
# Color 60 fps, depth 60 fps -- both streams run at the file's namesake
# rate. Not yet re-verified against the USB 3.x bandwidth / UVC watchdog
# ("Depth stream start failure") issue that motivated halving depth to
# 30fps in an earlier revision (checked 2026-07-29: this file's
# depth_module.profile was already '640x480x60', the halving was never
# actually applied here despite the comment claiming it was). If the UVC
# watchdog reappears on real hardware, drop depth_module.depth_profile back to
# '640x480x30' and update this comment again.
# see README.md for the frame-rate-split rationale

# realsense-ros 4.56 reads <module>.<stream>_profile and ignores the bare
# 'profile' key, falling back to the device default (not 640x480x60).
# 'profile' is what realsense-ros 4.51.1 (Humble) reads.
rgb_camera:
  color_profile: '640x480x60'
  profile: '640x480x60'
color_qos: "DEFAULT"

depth_module:
  depth_profile: '640x480x60'
  profile: '640x480x60'
  emitter_enabled: 1       # Keep IR emitter ON for structured-light depth accuracy.
  emitter_on_off: false    # Constant emission (not alternating with IR off frames).
depth_qos: "DEFAULT"
depth_info_qos: "DEFAULT"

enable_accel: false
enable_color: true
enable_depth: true
enable_gyro: false
enable_infra1: false
enable_infra2: false

align_depth.enable: false
publish_tf: true
initial_reset: true

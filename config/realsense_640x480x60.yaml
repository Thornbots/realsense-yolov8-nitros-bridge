# Color and depth at 640x480, 60 fps. See README.md#camera-profile.

rgb_camera:
  color_profile: '640x480x60'
  # Fixed short exposure limits motion blur and rolling-shutter skew on
  # moving armor; gain recovers brightness. Exposure is in 100 us units
  # (30 = 3 ms). Untuned starting values: tune on the field lighting.
  enable_auto_exposure: false
  exposure: 30
  gain: 64
color_qos: "DEFAULT"

depth_module:
  depth_profile: '640x480x60'
  emitter_enabled: 1       # Keep IR emitter ON for structured-light depth accuracy.
  emitter_on_off: false    # Constant emission (not alternating with IR off frames).
depth_qos: "DEFAULT"
depth_info_qos: "DEFAULT"

enable_accel: false
enable_color: true
enable_depth: true
enable_gyro: false
enable_infra1: false
enable_infra2: false

align_depth.enable: false
publish_tf: true
initial_reset: true
